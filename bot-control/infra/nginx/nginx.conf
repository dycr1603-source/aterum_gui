map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream dashboard_upstream {
  zone dashboard_upstream 64k;
  server dashboard:3001 resolve;
}

upstream chart_upstream {
  zone chart_upstream 64k;
  server dashboard:3000 resolve;
}

upstream n8n_upstream {
  zone n8n_upstream 64k;
  server dashboard:5678 resolve;
}

server {
  listen 80;
  listen [::]:80;
  server_name ${APP_DOMAIN};

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://${APP_DOMAIN}$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ${APP_DOMAIN};
  server_tokens off;
  client_max_body_size 50m;

  ssl_certificate /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location = /healthz {
    proxy_pass http://dashboard_upstream;
  }

  location /chart {
    proxy_pass http://chart_upstream;
  }

  location /api/ {
    proxy_pass http://dashboard_upstream;
  }

  location = /api {
    proxy_pass http://dashboard_upstream/healthz;
  }

  location = /news {
    proxy_pass http://dashboard_upstream/ai-data;
  }

  location /webhook/ {
    proxy_pass http://n8n_upstream;
  }

  location /webhook-test/ {
    proxy_pass http://n8n_upstream;
  }

  location /webhook-waiting/ {
    proxy_pass http://n8n_upstream;
  }

  location /rest/ {
    proxy_pass http://n8n_upstream;
  }

  location /aterum-assets/ {
    proxy_pass http://dashboard_upstream;
  }

  location /assets/ {
    proxy_pass http://n8n_upstream;
  }

  location /static/ {
    proxy_pass http://n8n_upstream;
  }

  location = /static/base-path.js {
    default_type application/javascript;
    return 200 "window.BASE_PATH = '/n8n/';\n";
  }

  location = /favicon.ico {
    proxy_pass http://n8n_upstream;
  }

  location = /n8n {
    return 301 /n8n/;
  }

  location /n8n/ {
    rewrite ^/n8n/(.*)$ /$1 break;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://n8n_upstream;
  }

  location /ws {
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://dashboard_upstream;
  }

  location / {
    proxy_pass http://dashboard_upstream;
  }
}

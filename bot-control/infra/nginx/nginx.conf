map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream dashboard_upstream {
  server dashboard:3001;
}

upstream chart_upstream {
  server dashboard:3000;
}

upstream n8n_upstream {
  server dashboard:5678;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location = /healthz {
    proxy_pass http://dashboard_upstream;
  }

  location /chart {
    proxy_pass http://chart_upstream;
  }

  location /api/ {
    proxy_pass http://dashboard_upstream;
  }

  location = /api {
    proxy_pass http://dashboard_upstream;
  }

  location /webhook/ {
    proxy_pass http://n8n_upstream;
  }

  location /webhook-test/ {
    proxy_pass http://n8n_upstream;
  }

  location /rest/ {
    proxy_pass http://n8n_upstream;
  }

  location /assets/ {
    proxy_pass http://n8n_upstream;
  }

  location /static/ {
    proxy_pass http://n8n_upstream;
  }

  location = /favicon.ico {
    proxy_pass http://n8n_upstream;
  }

  location = /n8n {
    return 301 /n8n/;
  }

  location /n8n/ {
    rewrite ^/n8n/(.*)$ /$1 break;
    proxy_pass http://n8n_upstream;
  }

  location /ws {
    proxy_pass http://dashboard_upstream;
  }

  location / {
    proxy_pass http://dashboard_upstream;
  }
}
